{% load static %}

{% include 'header.html' %}

<!-- login section -->
<section class="login-section pt-100 pb-100">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 offset-lg-3 col-md-8 offset-md-2">
                <div class="login-container">
                    <h2 class="text-center mb-5">Iniciar Sesión</h2>
                    
                    {% if mensaje %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle"></i> {{ mensaje }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endif %}

                    <form action="{% url 'login' %}" method="post" novalidate>
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="username" 
                                name="username" 
                                placeholder="Ingrese su usuario" 
                                required
                            >
                            <small class="form-text text-muted">Ingrese su nombre de usuario</small>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input 
                                type="password" 
                                class="form-control" 
                                id="password" 
                                name="password" 
                                placeholder="Ingrese su contraseña" 
                                required
                            >
                            <small class="form-text text-muted">Ingrese su contraseña</small>
                        </div>

                        <button type="submit" class="btn btn-success w-100 btn-lg">
                            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted">
                            ¿No tienes cuenta? <a href="#" class="text-decoration-none">Regístrate aquí</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- end login section -->

{% include 'footer.html' %}
